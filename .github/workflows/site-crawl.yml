# 임시 점검용 — 실제 사이트를 훑어 상태만 기록한다. main 에는 올리지 않는다.
# 로그가 공개될 수 있으므로 문서 내용은 찍지 않고 열림·오류·잠금 여부만 남긴다.
name: Site crawl check

on:
  push:
    branches: [claude/amazing-franklin-9w9kg4]

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Crawl
        run: |
          cat > crawl.mjs <<'JS'
          const BASE = "https://chaeheon-wiki.co0717gjs.workers.dev";
          const get = async (p) => {
            try {
              const r = await fetch(BASE + p, { redirect: "manual" });
              return { status: r.status, html: await r.text() };
            } catch (e) { return { status: "ERR " + e.message, html: "" }; }
          };
          // 문서 목록: 사이트맵 + 대문 링크
          const paths = new Set(["/"]);
          const sm = await get("/sitemap.xml");
          for (const [, u] of sm.html.matchAll(/<loc>(.*?)<\/loc>/g)) paths.add(new URL(u).pathname);
          const home = await get("/");
          for (const [, h] of home.html.matchAll(/href="(\/[^"#?]*)"/g))
            if (!/^\/(_next|admin|api)/.test(h) && !/\.\w+$/.test(h)) paths.add(h);
          const smSlugs = [...new Set([...sm.html.matchAll(/<loc>(.*?)<\/loc>/g)].map(([, u]) => decodeURIComponent(new URL(u).pathname).split("/")[1] || "(대문)"))];
          console.log(`사이트맵에 있는 문서: ${smSlugs.join(", ")}`);
          // 잠긴 문서는 사이트맵에서 빠졌으니 대문 링크에서 찾고, 하위 문서도 직접 넣는다
          for (const p of [...paths]) { const seg = p.split("/")[1]; if (seg) for (const s of ["", "/cv", "/work", "/research", "/contact"]) paths.add(`/${seg}${s}`); }
          // 지난 점검에서 본 잠긴 문서의 작업 상세 주소 (이제 사이트맵에 없다)
          for (const p of ["/김수현/work/regular", "/김수현/work/summerperformance"]) paths.add(encodeURI(p));
          console.log(`sitemap HTTP ${sm.status}, 대문 HTTP ${home.status}, 점검할 주소 ${paths.size}개\n`);
          // 잠금 화면에는 없어야 할 본문 표식(목차·프로필 상자)
          const BODY = /toc-heading|aria-label\\?"\s*[:=]\s*\\?"프로필\\?"/;
          let bad = 0;
          const rows = [];
          for (const p of [...paths].sort()) {
            const { status, html } = await get(p);
            const appErr = html.includes("Application error") || html.includes("server-side exception");
            const locked = html.includes("잠긴 문서다");
            const leak = locked && BODY.test(html);
            if (status !== 200 || appErr || leak) bad++;
            const title = locked ? (html.match(/<title>(.*?)<\/title>/)?.[1] ?? "") : "";
            rows.push(`${status === 200 && !appErr ? "OK  " : "FAIL"}${locked ? ` [탭제목: ${title}]` : ""} ${String(status).padEnd(4)} ${locked ? (leak ? "잠김·본문노출" : "잠김·안전") : "공개"}${appErr ? " 오류문구있음" : ""}  ${decodeURIComponent(p)}`);
          }
          console.log(rows.join("\n"));
          // yubin 프로필 상자의 칸 이름만 (값은 찍지 않는다)
          const y = await get("/yubin");
          const box = /aria-label="프로필".*?<\/dl>/s.exec(y.html)?.[0] ?? "";
          const labels = [...box.matchAll(/<dt[^>]*>(.*?)<\/dt>/g)].map((m) => m[1]);
          console.log(`\n/yubin 프로필 상자 칸 이름: ${labels.join(", ") || "(없음)"}`);
          console.log(`문제 있는 주소: ${bad}개`);
          JS
          node crawl.mjs
